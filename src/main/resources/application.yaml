spring:
  application:
    name: bookingsystem

  datasource:
    url: ${DB_URL:jdbc:mysql://localhost:3306/bookingsystem}
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD:1234}

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true

server:
  port: 8080
