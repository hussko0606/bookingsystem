services:
  mysql:
    image: mysql:8.4
    container_name: bookingsystem-mysql
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_PASSWORD:-1234}
      MYSQL_DATABASE: bookingsystem
    ports:
      - "3306:3306"
    volumes:
      - bookingsystem_mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-p${DB_PASSWORD:-1234}"]
      interval: 10s
      timeout: 5s
      retries: 10

volumes:
  bookingsystem_mysql_data:
